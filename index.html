<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Essa linha garante que o site funcione perfeitamente na tela do celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meu Primeiro Cardápio 3D</title>
  
  <!-- Importando o Tailwind CSS para deixar o design bonito sem muito esforço -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Importando o cérebro do 3D: O Model Viewer do Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <!-- Estilo básico para o visualizador 3D -->
  <style>
    model-viewer {
      width: 100%;
      height: 350px;
      background-color: #f9fafb;
      border-radius: 12px;
    }
    /* Oculta a barra de progresso padrão para ficar mais elegante */
    model-viewer::part(default-progress-bar) {
      display: none;
    }
  </style>
</head>
<body class="bg-gray-100 flex justify-center p-4 antialiased">

  <!-- Cartão do Prato -->
  <div class="bg-white rounded-2xl shadow-lg w-full max-w-sm overflow-hidden mt-10">
    
    <!-- O Visualizador 3D -->
    <!-- Estamos usando um modelo de Abacate público do Khronos Group para este teste -->
    <model-viewer 
      src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/Avocado/glTF-Binary/Avocado.glb" 
      ios-src="" 
      alt="Modelo 3D de um Abacate" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      auto-rotate>
      
      <!-- Botão que aparece sobre o modelo para ativar o modo AR -->
      <button slot="ar-button" class="absolute bottom-4 right-4 bg-black text-white px-4 py-2 rounded-full font-semibold shadow-md flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        Ver na Mesa
      </button>
    </model-viewer>

    <!-- Informações do Prato -->
    <div class="p-5">
      <div class="flex justify-between items-start mb-2">
        <h2 class="text-2xl font-bold text-gray-800">Avocado Premium</h2>
        <span class="text-lg font-bold text-green-600">€ 8.50</span>
      </div>
      <p class="text-gray-600 text-sm mb-4">
        Nosso abacate fresco, escaneado em 3D para você. Gire o prato na tela ou clique no botão acima para ver o tamanho real na sua mesa.
      </p>
      <button class="w-full bg-green-500 text-white py-3 rounded-xl font-bold hover:bg-green-600 transition">
        Adicionar ao Pedido
      </button>
    </div>
  </div>

</body>
</html>
