<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cardápio 3D - Teste 2</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    /* Estilo direto no model-viewer para garantir que o tamanho seja respeitado */
    model-viewer {
      width: 100%;
      height: 400px;
      background-color: #f3f4f6;
    }
  </style>
</head>
<body class="bg-gray-100 flex justify-center p-4 antialiased">

  <div class="bg-white rounded-2xl shadow-lg w-full max-w-sm overflow-hidden mt-10">
    
    <!-- Visualizador 3D: Removi o botão customizado para usar o nativo -->
    <model-viewer 
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
      ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
      alt="Modelo 3D" 
      ar 
      camera-controls 
      auto-rotate>
    </model-viewer>

    <div class="p-5">
      <div class="flex justify-between items-start mb-2">
        <h2 class="text-2xl font-bold text-gray-800">Prato Teste</h2>
        <span class="text-lg font-bold text-green-600">€ 0.00</span>
      </div>
      <p class="text-gray-600 text-sm mb-4">
        Gire o modelo acima na tela. Para ver na mesa, clique no <b>ícone de cubo no canto inferior direito</b> da área cinza.
      </p>
    </div>
  </div>

</body>
</html>
